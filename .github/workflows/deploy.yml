name: Build and publish

# Builds the site (Dockerfile) and publishes it to the GitHub Container
# Registry on every push to master. The ZimaBoard's Watchtower container
# polls ghcr.io separately and pulls + restarts when it sees a new image —
# this workflow doesn't touch the board directly (it can't; SSH is off).
# workflow_dispatch lets you manually re-run a build from the Actions tab
# without needing an empty commit.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets this job publish to ghcr.io using the auto-provided
      # GITHUB_TOKEN below — no separate registry secret to manage.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
