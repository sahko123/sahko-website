# Example server block for serving the built site (`dist/`) on the ZimaOS box.
# Drop into /etc/nginx/conf.d/sahko.conf (or the equivalent nginx app config
# location on ZimaOS) and point `root` at wherever you copy `dist/` to.
#
# This sits behind a Cloudflare Tunnel, so it only needs to listen on
# localhost/plain HTTP — cloudflared terminates TLS and forwards to this
# origin over the tunnel, nothing needs to be port-forwarded.

server {
	listen 127.0.0.1:8080;
	server_name sahko.ie www.sahko.ie;

	root /path/to/sahko-website/dist;
	index index.html;

	# Astro's static output is one index.html per route directory. At this
	# site's size, Astro inlines all page CSS/JS directly into each HTML file
	# rather than emitting a separate fingerprinted /_astro/ bundle, and every
	# route is a clean directory URL (no literal .html in any real request) —
	# so there's no separate long-lived-asset tier to cache here. Every real
	# response gets the same short-revalidate policy; Cloudflare's edge cache
	# (see deploy/README.md) is what actually keeps repeat requests off this
	# origin.
	location / {
		try_files $uri $uri/ $uri/index.html =404;
		add_header Cache-Control "public, max-age=0, must-revalidate";
	}

	# The only genuinely static, unchanging-by-filename files are these —
	# safe to cache for a while since a favicon change means editing the file
	# in place, not a new URL.
	location ~* \.(ico|svg)$ {
		add_header Cache-Control "public, max-age=86400";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain;

	# Trust Cloudflare's connecting IP for logs/rate-limiting instead of the
	# tunnel's local address. Keep this list updated from
	# https://www.cloudflare.com/ips/ if you rely on it.
	set_real_ip_from 127.0.0.1;
	real_ip_header CF-Connecting-IP;

	error_page 404 /404.html;
}
