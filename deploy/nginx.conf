# Example server block for serving the built site (`dist/`) on the ZimaOS box.
# Drop into /etc/nginx/conf.d/sahko.conf (or the equivalent nginx app config
# location on ZimaOS) and point `root` at wherever you copy `dist/` to.
#
# This sits behind a Cloudflare Tunnel, so it only needs to listen on
# localhost/plain HTTP — cloudflared terminates TLS and forwards to this
# origin over the tunnel, nothing needs to be port-forwarded.

server {
	listen 127.0.0.1:8080;
	server_name sahko.ie www.sahko.ie;

	root /path/to/sahko-website/dist;
	index index.html;

	# Astro's static output is one index.html per route directory.
	location / {
		try_files $uri $uri/ $uri/index.html =404;
	}

	# Astro fingerprints assets under /_astro/ (content hash in the filename),
	# so these are safe to cache forever.
	location /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Everything else (HTML) should revalidate so deploys show up promptly —
	# Cloudflare's edge cache is the thing giving you the real speed-up here.
	location ~* \.html$ {
		add_header Cache-Control "public, max-age=0, must-revalidate";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain;

	# Trust Cloudflare's connecting IP for logs/rate-limiting instead of the
	# tunnel's local address. Keep this list updated from
	# https://www.cloudflare.com/ips/ if you rely on it.
	set_real_ip_from 127.0.0.1;
	real_ip_header CF-Connecting-IP;

	error_page 404 /404.html;
}
