# nginx config for serving the built site (`dist/`) on the ZimaBoard.
#
# This runs INSIDE an nginx Docker container on ZimaOS (see
# docker-compose.yml alongside this file) — ZimaOS is Docker-first and its
# own Caddy gateway already owns port 80 on the host, so the site gets its
# own container published on host port 8080 instead.
#
# Mounted to /etc/nginx/conf.d/default.conf, so this is a bare `server`
# block — nginx's own nginx.conf supplies the surrounding `http` context.

server {
	# Binds all interfaces *inside the container*; Docker is what decides
	# what that's reachable from on the host (see docker-compose.yml's port
	# mapping). Not 127.0.0.1 — that would only be reachable from within
	# this container, so cloudflared could never reach it.
	listen 8080 default_server;
	server_name sahko.ie www.sahko.ie;

	root /usr/share/nginx/html;
	index index.html;

	# Astro's static output is one index.html per route directory. HTML
	# should revalidate on every deploy so changes show up promptly —
	# Cloudflare's edge cache (see deploy/README.md) is what actually keeps
	# repeat requests off this origin.
	location / {
		try_files $uri $uri/ $uri/index.html =404;
		add_header Cache-Control "public, max-age=0, must-revalidate";
	}

	# Everything Astro emits here — the CSS bundle and the shared client
	# script — is content-hashed, so a new build always produces a new URL
	# and this can never serve a stale file. Safe to cache indefinitely.
	# `^~` pins this block to win over the regex location below, rather than
	# leaving it to nginx's location-matching precedence by accident.
	location ^~ /_astro/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# The remaining static files — favicons and the OG share image — are
	# hand-placed in public/ and have NO filename hash, so their contents can
	# change under the same URL. A day is the ceiling before a change is
	# guaranteed visible. Deliberately no `js` here: every script on this site
	# is hashed under /_astro/ above, and matching unhashed `.js` was what
	# once pinned a stale site.js in caches for a full day after each deploy.
	# (Social icons aren't here either: they're fetched per-visit from
	# cdn.simpleicons.org.)
	location ~* \.(ico|svg|png)$ {
		add_header Cache-Control "public, max-age=86400";
	}

	gzip on;
	gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

	# Recover the real visitor IP for logs. Requests arrive from the
	# cloudflared container, so the immediate peer is a private Docker/LAN
	# address, never a real client — trusting those ranges is safe here
	# because nothing else can reach this container. CF-Connecting-IP is set
	# by Cloudflare's edge and is the actual visitor.
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	set_real_ip_from 10.0.0.0/8;
	real_ip_header CF-Connecting-IP;

	error_page 404 /404.html;
}
