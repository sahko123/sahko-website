# nginx container serving the built site on the ZimaBoard.
#
# ZimaOS is Docker-first and its own Caddy gateway already owns host port
# 80, so this publishes on 8080 instead. Expected layout on the box:
#
#   /DATA/AppData/sahko-website/
#   ├── docker-compose.yml   <- this file
#   ├── nginx.conf           <- from deploy/nginx.conf
#   └── dist/                <- the built site (rsync/copy target)
#
# Bring it up with:  docker compose up -d
# Update the site:   replace dist/, then  docker compose restart

services:
  sahko-website:
    # Major-version pin: picks up patch/security updates on an explicit
    # `docker compose pull`, without a surprise major bump breaking config.
    image: nginx:1-alpine
    container_name: sahko-website
    restart: unless-stopped
    ports:
      # host:container. Bound on all host interfaces so the cloudflared
      # container can reach it via the host's LAN IP — from inside that
      # container, "localhost" is itself, not the ZimaBoard.
      - '8080:8080'
    volumes:
      # Read-only: nginx only ever serves these, never writes them.
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
